name: Push Reminders Cron

on:
  schedule:
    # Every 30 minutes, on the hour and the half hour.
    #
    # The half-hour tick is not cosmetic: India (UTC+5:30), Iran (+3:30) and
    # parts of Australia (+9:30 / +10:30) sit on half-hour offsets, so an
    # hourly UTC schedule lands at :30 past their local hour and a reminder set
    # for 10:00 IST could never fire on time.
    #
    # GitHub Actions cron is BEST-EFFORT: runs are queued, not guaranteed, and
    # regularly start several minutes - occasionally much longer - after the
    # scheduled minute. Reminder times are therefore approximate.
    #
    # REMINDER_GRACE_MIN in src/lib/reminders.ts is 30 - exactly one tick wide,
    # so every minute-of-day is covered by exactly one tick and the worst-case
    # lateness is 29 minutes. It used to be 90, wide enough to catch up a
    # skipped tick, and that is deliberately no longer the behaviour: a run that
    # is skipped or badly delayed now DROPS that person's reminder for the day
    # rather than delivering it stale. A nudge to check in that arrives an hour
    # and a half late is a nag, and a nag is what makes somebody revoke push
    # permission outright - which also costs them the approval notifications
    # they want. A missed nudge costs nothing anybody notices.
    #
    # Dedupe is `reminder_log`, not the window: a doubled run still sends each
    # person at most one reminder per kind per local day.
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Gate (require cron secrets)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const ok = Boolean(process.env.CRON_SECRET && process.env.APP_URL)
            core.setOutput('ok', ok ? 'true' : 'false')

      - name: Trigger push reminders
        if: steps.gate.outputs.ok == 'true'
        run: |
          curl -sf -m 30 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/push/cron"
